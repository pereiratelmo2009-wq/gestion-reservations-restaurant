services:
  - type: web
    name: gestion-reservations
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: TEAM_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-6.2-astra
      - key: DATABASE_URL
        fromDatabase:
          name: reservations-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
databases:
  - name: reservations-db
    plan: basic-256mb
